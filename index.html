<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <title>GitHub + Google Apps Script</title>
</head>
<body>
    <h1>เชื่อมต่อ Google Apps Script สำเร็จ</h1>
    <button id="loadBtn">โหลดข้อมูล</button>
    <p id="result"></p>

    <script>
        const WEB_APP_URL = "ใส่_Web_App_URL_ของ_Google_Apps_Script_ที่นี่";

        document.getElementById("loadBtn").addEventListener("click", () => {
            fetch(WEB_APP_URL)
                .then(response => response.json())
                .then(data => {
                    document.getElementById("result").innerText = data.message;
                })
                .catch(error => console.error("Error:", error));
        });
    </script>
</body>
</html>
